name: Secret scanning
on:
  push:
  pull_request:
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-scanner"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-scanner" gitleaks
      - name: Check history without printing credentials
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks-scanner/gitleaks" git . --config .github/security/gitleaks.toml --gitleaks-ignore-path .github/security/.gitleaksignore --ignore-gitleaks-allow --redact=100 --no-banner --log-opts="--all --full-history"
